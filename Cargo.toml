[package]
name = "nwasabi"
version = "0.1.0"
edition = "2024"
default-run = "nwasabi"
description = "Cœur d'émulation des applications externes (.nwa) des calculatrices NumWorks"
license = "AGPL-3.0-only"
authors = ["Oignontom8283"]
repository = "https://github.com/Oignontom8283/nwasabi"
homepage = "https://github.com/Oignontom8283/nwasabi"
documentation = "https://github.com/Oignontom8283/nwasabi/tree/main/docs"
readme = "README.md"
rust-version = "1.88"
keywords = ["numworks", "emulator", "wasm", "cortex-m", "gdb"]
categories = ["emulators", "wasm", "development-tools::debugging"]
# Le paquet publié ne contient que ce qui sert à compiler : le code (`src/`), le script de
# construction et les sources de l'interface web. Ni les tests (et leurs références), ni l'exemple,
# ni les recettes `just`.
exclude = ["/tests", "/example", "/docs", "/packages/wasm", "/justfile", "/web/node_modules", "/web/dist", "/local"]

[lib]
path = "src/lib.rs"
# `cdylib` produit le module WebAssembly (feature `wasm`) ; `rlib` sert aux binaires et aux tests.
crate-type = ["rlib", "cdylib"]

# `nwasabi` : serveur web pour essayer l'émulateur (embarque la page de démonstration et la version WebAssembly).
[[bin]]
name = "nwasabi"
path = "src/server/main.rs"
required-features = ["serve"]

# `nwasabi-cli` : outil de test natif en ligne de commande (le cœur est compilé dans le binaire).
[[bin]]
name = "nwasabi-cli"
path = "src/cli/main.rs"
required-features = ["cli"]

[features]
default = ["serve"]
serve = ["dep:axum", "dep:tokio", "dep:rust-embed", "dep:clap", "dep:tower-http"]
cli = ["dep:clap", "dep:png"]
wasm = []

[dependencies]
serde_json = "1"
png = { version = "0.18", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess", "interpolate-folder-path"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
gimli = { version = "0.34.0", default-features = false, features = ["read", "std", "endian-reader"] }
rustc-demangle = "0.1.28"
cpp_demangle = "0.5.1"
thiserror = "2.0.21"
base64 = "0.23.1"
hex = "0.4.3"
crc32fast = "1.5.4"
tower-http = { version = "0.7.1", default-features = false, features = ["compression-gzip"], optional = true }

[dev-dependencies]
divan = "0.1.21"
flate2 = "1.1.10"
insta = "1.49.0"
png = "0.18"

# Les tests du corpus exécutent des dizaines de millions d'instructions émulées.
[profile.test]
opt-level = 2

# Module WebAssembly livré au navigateur : petit et rapide (`just build-wasm`).
[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# `build.rs` réécrit le package.json des workspaces npm (dépendance de compilation : absente du binaire).
[build-dependencies]
serde_json = "1"

# Binaires natifs (`cargo install nwasabi`, `just build-server`) : édition de liens globale et une seule unité de compilation, pour
# des exécutions plus rapides et des binaires plus petits ; les informations de débogage de Nwasabi lui-même sont retirées.
[profile.release]
lto = true
codegen-units = 1
strip = true

# Mesure de la vitesse réelle du processeur émulé : `cargo bench --bench cpu` (jamais lancée par `cargo test`).
[[bench]]
name = "cpu"
harness = false
